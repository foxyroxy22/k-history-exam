<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한능검 복습</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --primary: #ff385c; --primary-soft: #fff0f3;
  --ink: #222222; --body: #3f3f3f; --muted: #6a6a6a; --muted-soft: #929292;
  --hairline: #dddddd; --hairline-soft: #ebebeb;
  --canvas: #ffffff; --surface-soft: #f7f7f7; --surface-strong: #f2f2f2;
  --add: #8a8a8a;
  --shadow: rgba(0,0,0,0.02) 0 0 0 1px, rgba(0,0,0,0.04) 0 2px 6px 0, rgba(0,0,0,0.1) 0 4px 8px 0;
  --r-sm: 8px; --r-md: 14px; --r-xl: 32px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary-soft: #3a1720;
    --ink: #f2f2f2; --body: #d6d6d6; --muted: #a0a0a0; --muted-soft: #7a7a7a;
    --hairline: #3a3a3a; --hairline-soft: #2c2c2c;
    --canvas: #181818; --surface-soft: #222222; --surface-strong: #2a2a2a;
    --add: #8f8f8f;
    --shadow: rgba(0,0,0,0.4) 0 0 0 1px, rgba(0,0,0,0.3) 0 4px 8px 0;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 132px; }
body {
  margin: 0; background: var(--canvas); color: var(--body);
  font-family: Pretendard, -apple-system, system-ui, sans-serif;
  font-size: 16px; line-height: 1.6; word-break: keep-all;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
strong { color: var(--ink); font-weight: 600; }
.star { color: var(--primary); font-weight: 700; }
.add { color: var(--add); font-size: 0.94em; }
.add::before { content: "보충 "; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; border: 1px solid var(--hairline); border-radius: 999px; padding: 0 6px; margin-right: 2px; vertical-align: 1px; }

/* 상단 바 */
header.top { position: sticky; top: 0; z-index: 10; background: var(--canvas); border-bottom: 1px solid var(--hairline-soft); }
.top .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
.logo { color: var(--primary); font-weight: 700; font-size: 18px; letter-spacing: -0.3px; white-space: nowrap; }
.lect-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.lect-tabs a { padding: 8px 14px; border-radius: 999px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap; }
.lect-tabs a.on { color: var(--ink); background: var(--surface-strong); }

/* 섹션 이동 (검색바 모양 알약) */
.jump { position: sticky; top: 64px; z-index: 9; background: var(--canvas); padding: 12px 0; }
.pill { display: flex; border: 1px solid var(--hairline); border-radius: 999px; box-shadow: var(--shadow); overflow-x: auto; scrollbar-width: none; background: var(--canvas); }
.pill a { flex: 1; text-align: center; padding: 10px 16px; color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap; border-right: 1px solid var(--hairline-soft); }
.pill a:last-child { border-right: 0; }
.pill a:hover { background: var(--surface-soft); }

/* 히어로 */
.hero { padding: 32px 0 8px; }
.hero h1 { margin: 0; color: var(--ink); font-size: 28px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.3; }
.hero .sub { color: var(--muted); margin: 4px 0 20px; }
.hero-row { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
.card { border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 24px; background: var(--canvas); }
.oneline .label, .player .label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
.oneline p { margin: 6px 0 0; font-size: 20px; color: var(--ink); line-height: 1.45; letter-spacing: -0.2px; }
.player audio { width: 100%; margin-top: 10px; }
.player .hint { font-size: 13px; color: var(--muted-soft); margin-top: 6px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 16px; }

section { padding: 48px 0 0; }
h2 { color: var(--ink); font-size: 22px; font-weight: 600; letter-spacing: -0.4px; margin: 0 0 16px; }

/* 연표 */
.timeline { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding-top: 28px; }
.timeline::before { content: ""; position: absolute; top: 9px; left: 8px; right: 8px; height: 2px; background: var(--hairline); }
.tl { position: relative; }
.tl::before { content: ""; position: absolute; top: -26px; left: 0; width: 16px; height: 16px; border-radius: 50%; background: var(--canvas); border: 3px solid var(--primary); }
.tl .era { color: var(--ink); font-weight: 700; font-size: 18px; }
.tl .when { color: var(--primary); font-weight: 600; font-size: 14px; }
.tl .key { color: var(--muted); font-size: 14px; }
.tl.split { margin-top: 0; }
.divider-note { margin-top: 20px; display: inline-block; font-size: 14px; color: var(--ink); background: var(--primary-soft); border-radius: 999px; padding: 6px 14px; }

/* 비교표 */
.table-wrap { overflow-x: auto; border: 1px solid var(--hairline); border-radius: var(--r-md); }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--hairline-soft); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
thead th { color: var(--ink); font-weight: 600; background: var(--surface-soft); }
tbody th { color: var(--muted); font-weight: 600; white-space: nowrap; width: 64px; }

.pairs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
.pair { border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 16px 20px; }
.pair .label { font-size: 12px; font-weight: 600; color: var(--muted); }
.pair .flow { color: var(--ink); font-weight: 600; margin-top: 4px; }
.pair .flow span { color: var(--primary); margin: 0 6px; }

/* 시대별 */
.era-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.era-head h2 { margin: 0; }
.era-head .when { color: var(--primary); font-weight: 600; font-size: 14px; }
.lead { color: var(--muted); margin: 0 0 20px; }
.era-body { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
.points { list-style: none; margin: 0; padding: 0; }
.points li { padding: 12px 0; border-bottom: 1px solid var(--hairline-soft); }
.points li:first-child { padding-top: 0; }
.points li.is-star { color: var(--ink); }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.photo { text-decoration: none; color: inherit; display: block; }
.photo .img { position: relative; aspect-ratio: 4 / 3; border-radius: var(--r-md); overflow: hidden; background: var(--surface-soft); }
.photo img { width: 100%; height: 100%; object-fit: contain; display: block; transition: transform .3s; }
.photo:hover img { transform: scale(1.03); }
.badge { position: absolute; top: 10px; left: 10px; background: #fff; color: #222; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 4px 10px; box-shadow: var(--shadow); }
.photo .name { color: var(--ink); font-weight: 600; font-size: 15px; margin-top: 8px; }
.photo .credit { color: var(--muted-soft); font-size: 12px; line-height: 1.4; }
.photo.missing .img { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 16px; gap: 8px; border: 1px dashed var(--hairline); }
.photo.missing .note { font-size: 13px; color: var(--muted); }
.photo.missing .go { font-size: 13px; font-weight: 600; color: var(--primary); }

/* 퀴즈 */
.quiz { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.q { border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 20px; cursor: pointer; background: var(--canvas); transition: box-shadow .2s; text-align: left; font: inherit; color: inherit; }
.q:hover { box-shadow: var(--shadow); }
.q .num { font-size: 12px; font-weight: 600; color: var(--muted); }
.q .text { color: var(--ink); font-weight: 500; margin-top: 4px; }
.q .ans { margin-top: 12px; color: var(--primary); font-weight: 700; font-size: 18px; display: none; }
.q.open .ans { display: block; }
.q .tap { margin-top: 12px; font-size: 13px; color: var(--muted-soft); }
.q.open .tap { display: none; }

.ex { display: inline-block; font-size: 11px; font-weight: 600; color: var(--primary); background: var(--primary-soft); border-radius: 999px; padding: 1px 8px; vertical-align: 1px; white-space: nowrap; }
.add .ex { font-size: 11px; }
h3 { color: var(--ink); font-size: 16px; font-weight: 600; margin: 32px 0 12px; }
.exam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.exam-grid .label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
.bar { display: grid; grid-template-columns: 56px 1fr 40px; align-items: center; gap: 12px; margin: 10px 0; }
.bar-name { color: var(--ink); font-weight: 600; font-size: 14px; }
.bar-track { height: 10px; background: var(--surface-strong); border-radius: 999px; overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.bar-n { font-size: 14px; color: var(--muted); text-align: right; }
.hint { font-size: 13px; color: var(--muted-soft); }
.howto { margin: 0; padding-left: 0; list-style: none; }
.howto li { padding: 6px 0; font-size: 15px; }
.clues { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.clues .card { padding: 20px; }
.clue-era { color: var(--primary); font-weight: 700; margin-bottom: 8px; }
.clues ul { margin: 0; padding-left: 18px; font-size: 15px; }
.clues li { padding: 3px 0; }
table.traps { min-width: 560px; }
.opts { list-style: none; margin: 12px 0 0; padding: 0; font-size: 14px; }
.opts li { display: flex; gap: 6px; padding: 2px 0; }
.opts span { color: var(--muted); }
.q .why { font-size: 14px; color: var(--body); font-weight: 400; margin-top: 4px; }

.timeline { grid-template-columns: repeat(var(--cols, 4), 1fr); }
.curve { padding: 16px; overflow-x: auto; }
.curve svg { width: 100%; min-width: 620px; height: auto; display: block; }
.curve .grid { stroke: var(--hairline-soft); stroke-width: 1; }
.curve .line { fill: none; stroke: var(--primary); stroke-width: 3; stroke-linejoin: round; }
.curve .dot { fill: var(--canvas); stroke: var(--primary); stroke-width: 3; }
.curve .star-dot { fill: var(--primary); }
.curve .xl { font-size: 13px; fill: var(--ink); text-anchor: middle; font-weight: 600; }
.curve .tl2 { font-size: 11px; fill: var(--muted); text-anchor: middle; }
.curve .axis { font-size: 11px; fill: var(--muted-soft); }
.curve-notes { margin: 16px 0 0; padding-left: 20px; font-size: 15px; }
.curve-notes li { padding: 4px 0; }
.chrono { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--hairline); }
.chrono li { display: grid; grid-template-columns: 64px 64px 1fr; gap: 12px; align-items: baseline; padding: 8px 0 8px 16px; position: relative; }
.chrono li::before { content: ""; position: absolute; left: -6px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--canvas); border: 2px solid var(--primary); }
.chrono li.is-star::before { background: var(--primary); }
.chrono .cy { color: var(--primary); font-weight: 700; font-variant-numeric: tabular-nums; }
.chrono .ctag { font-size: 12px; font-weight: 600; color: var(--muted); }
.chrono .ct { color: var(--body); }
.chrono li.is-star .ct { color: var(--ink); }
.kings { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
.king { border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 16px 18px; }
.king.is-star { border-color: var(--primary); }
.kh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.kn { color: var(--ink); font-weight: 700; font-size: 17px; }
.kw { color: var(--primary); font-size: 13px; font-weight: 600; }
.king ul { margin: 0; padding-left: 18px; font-size: 15px; }
.king li { padding: 2px 0; }
.era-body.photos-only { grid-template-columns: 1fr; }
.era-body.photos-only .photos { grid-template-columns: repeat(4, 1fr); }

footer { padding: 64px 0 48px; color: var(--muted-soft); font-size: 12px; }

@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .hero-row, .era-body, .quiz, .pairs, .exam-grid, .clues, .kings { grid-template-columns: 1fr; }
  .era-body.photos-only .photos { grid-template-columns: 1fr 1fr; }
  .chrono li { grid-template-columns: 52px 1fr; }
  .chrono .ctag { display: none; }
  .timeline { grid-template-columns: 1fr; padding: 0 0 0 28px; gap: 20px; }
  .timeline::before { top: 8px; bottom: 8px; left: 7px; right: auto; width: 2px; height: auto; }
  .tl::before { top: 4px; left: -28px; }
  .hero h1 { font-size: 24px; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="logo">한능검 복습</div><nav class="lect-tabs" id="tabs"></nav></div></header>
<main id="app"></main>

<script>const LECTURES = [];</script>
<script src="data/list.js"></script>
<script>
// data/list.js 의 번호대로 data/XX.js 를 차례로 불러온 뒤 화면을 그림 (file:// 에서도 동작)
(function load(i) {
  if (i >= LIST.length) return render();
  const s = document.createElement("script");
  s.src = `data/${LIST[i]}.js`;
  s.onload = s.onerror = () => load(i + 1);
  document.body.appendChild(s);
})(0);

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmt = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/\{\{(.+?)\}\}/g, '<span class="add">$1</span>')
  .replace(/&lt;&lt;(.+?)&gt;&gt;/g, '<span class="ex">$1</span>')
  .replace(/★+/g, m => `<span class="star">${m}</span>`);
const CIRCLED = "①②③④⑤";

function examSection(E) {
  if (!E) return "";
  const max = Math.max(...E.dist.map(d => d.n));
  const total = E.dist.reduce((s, d) => s + d.n, 0);
  return `
    <section id="exam"><h2>기출 분석</h2>
      <p class="lead">${esc(E.range)}<br>${fmt(E.format)}</p>
      <div class="exam-grid">
        <div class="card"><div class="label">어느 시대가 나왔나</div>
          ${E.dist.map(d => `<div class="bar"><span class="bar-name">${esc(d.era)}</span><span class="bar-track"><span class="bar-fill" style="width:${max ? d.n / max * 100 : 0}%"></span></span><span class="bar-n">${d.n}회</span></div>`).join("")}
          <div class="hint">전체 ${total}회 중</div></div>
        <div class="card"><div class="label">이렇게 공부하세요</div>
          <ol class="howto">${E.howto.map(h => `<li>${fmt(h)}</li>`).join("")}</ol></div>
      </div>
      <h3>자료에 이 단서가 보이면 → 이 시대</h3>
      <div class="clues">${E.clues.map(c => `<div class="card"><div class="clue-era">${esc(c.era)}</div><ul>${c.items.map(i => `<li>${fmt(i)}</li>`).join("")}</ul></div>`).join("")}</div>
      <h3>정답으로 나온 선지</h3>
      <div class="clues">${E.answers.map(c => `<div class="card"><div class="clue-era">${esc(c.era)}</div><ul>${c.items.map(([t, n]) => `<li>${fmt(t)} <span class="ex">${n}회</span></li>`).join("")}</ul></div>`).join("")}</div>
      <h3>오답 단골 · 보자마자 지우기</h3>
      <div class="table-wrap"><table class="traps"><thead><tr><th>선지</th><th>왜 오답?</th><th>빈도</th></tr></thead>
        <tbody>${E.traps.map(([t, w, n]) => `<tr><td><strong>${fmt(t)}</strong></td><td>${fmt(w)}</td><td>${esc(n)}</td></tr>`).join("")}</tbody></table></div>
      <h3>내 메모에서 보강한 부분</h3>
      <ul class="points gaps">${E.gaps.map(g => `<li>${fmt(g)}</li>`).join("")}</ul>
    </section>`;
}

function curveSection(C) {
  const W = 760, H = 240, px = 36, top = 24, bottom = 40;
  const n = C.points.length, step = (W - px * 2) / (n - 1);
  const x = i => px + i * step, y = v => top + (5 - v) / 4 * (H - top - bottom);
  const path = C.points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  return `<section id="curve"><h2>${esc(C.title)}</h2>
    ${C.note ? `<p class="lead">${fmt(C.note)}</p>` : ""}
    <div class="card curve"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(C.title)}">
      ${[1, 2, 3, 4, 5].map(v => `<line x1="${px}" x2="${W - px}" y1="${y(v)}" y2="${y(v)}" class="grid"/>`).join("")}
      <path d="${path}" class="line"/>
      ${C.points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="${p.star ? 7 : 5}" class="${p.star ? "dot star-dot" : "dot"}"/>
        <text x="${x(i)}" y="${H - 18}" class="xl">${esc(p.label)}</text>
        ${p.tag ? `<text x="${x(i)}" y="${y(p.v) - 12}" class="tl2">${esc(p.tag)}</text>` : ""}`).join("")}
      <text x="4" y="${top + 4}" class="axis">강</text><text x="4" y="${H - bottom}" class="axis">약</text>
    </svg></div>
    <ol class="curve-notes">${C.points.map(p => `<li><strong>${esc(p.label)}</strong> ${fmt(p.note)}</li>`).join("")}</ol>
  </section>`;
}

function quizCard(q, i) {
  const opts = q.opts ? `<ol class="opts">${q.opts.map((o, j) => `<li><span>${CIRCLED[j]}</span>${fmt(o)}</li>`).join("")}</ol>` : "";
  const ans = typeof q.a === "number" ? `${CIRCLED[q.a - 1]} ${fmt(q.opts[q.a - 1])}` : fmt(q.a);
  return `<button class="q" type="button"><div class="num">Q${i + 1}</div><div class="text">${fmt(q.q)}</div>${opts}
    <div class="tap">눌러서 정답 보기</div><div class="ans">${ans}${q.why ? `<div class="why">${fmt(q.why)}</div>` : ""}</div></button>`;
}

function photo(p) {
  const badge = p.star ? '<span class="badge">★ 사진 필수</span>' : "";
  if (p.missing) {
    const q = encodeURIComponent(p.name + " 유물");
    return `<a class="photo missing" href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank" rel="noopener">
      <div class="img">${badge}<div class="note">${fmt(p.note)}</div><div class="go">이미지 검색에서 보기 ↗</div></div>
      <div class="name">${fmt(p.name)}</div></a>`;
  }
  return `<a class="photo" href="${p.page}" target="_blank" rel="noopener">
    <div class="img">${badge}<img src="${p.src}" alt="${esc(p.name)}" loading="lazy"></div>
    <div class="name">${fmt(p.name)}</div><div class="credit">${fmt(p.credit)}</div></a>`;
}

function render() {
  const id = new URLSearchParams(location.search).get("l") || LECTURES[LECTURES.length - 1]?.id;
  const L = LECTURES.find(x => x.id === id) || LECTURES[0];
  if (!L) { document.getElementById("app").innerHTML = '<div class="wrap hero">강의 데이터가 없어요.</div>'; return; }
  document.title = `${+L.id}강 ${L.title} · 한능검 복습`;
  document.getElementById("tabs").innerHTML = LECTURES.map(x =>
    `<a href="?l=${x.id}" class="${x.id === L.id ? "on" : ""}">${+x.id}강 ${esc(x.title)}</a>`).join("");

  const jump = [
    ...(L.exam ? [["exam", "기출"]] : []),
    ...(L.timeline ? [["timeline", "연표"]] : []),
    ...(L.curve ? [["curve", "흥망 그래프"]] : []),
    ...(L.chrono ? [["chrono", L.chrono.short || "연표"]] : []),
    ...(L.compare ? [["compare", "비교표"]] : []),
    ...L.eras.map(e => [e.id, e.name]), ["quiz", "퀴즈"]];

  document.getElementById("app").innerHTML = `
  <div class="jump"><div class="wrap"><nav class="pill">${jump.map(([h, t]) => `<a href="#${h}">${t}</a>`).join("")}</nav></div></div>
  <div class="wrap">
    <div class="hero">
      <h1>${+L.id}강 · ${esc(L.title)}</h1>
      <div class="sub">${esc(L.subtitle)}</div>
      <div class="hero-row">
        <div class="card oneline"><div class="label">오늘의 한 줄</div><p>${fmt(L.oneLine)}</p></div>
        <div class="card player"><div class="label">복습 라디오</div>
          <audio controls preload="metadata" src="${L.audio}"></audio>
          <div class="hint">1.5배속으로 녹음된 파일이에요. 마지막에 퀴즈가 있어요.</div></div>
      </div>
      <div class="legend"><span><span class="star">★</span> 노션 메모에서 중요 표시한 것</span><span><span class="add">메모에 없던 설명</span></span><span><span class="ex">기출</span> 최근 5년 출제 횟수</span></div>
    </div>

    ${examSection(L.exam)}

    ${L.timeline ? `<section id="timeline"><h2>연표</h2>
      <div class="timeline" style="--cols:${L.timeline.length}">${L.timeline.map(t => `<div class="tl"><div class="era">${esc(t.era)}</div><div class="when">${esc(t.when)}</div><div class="key">${fmt(t.key)}</div></div>`).join("")}</div>
      ${L.timelineNote ? `<div class="divider-note">${fmt(L.timelineNote)}</div>` : ""}
    </section>` : ""}

    ${L.curve ? curveSection(L.curve) : ""}

    ${L.chrono ? `<section id="chrono"><h2>${esc(L.chrono.title)}</h2>
      ${L.chrono.note ? `<p class="lead">${fmt(L.chrono.note)}</p>` : ""}
      <ol class="chrono">${L.chrono.items.map(c => `<li class="${c.star ? "is-star" : ""}"><span class="cy">${esc(String(c.y))}</span><span class="ctag">${esc(c.tag || "")}</span><span class="ct">${fmt(c.t)}</span></li>`).join("")}</ol>
    </section>` : ""}

    ${L.compare ? `<section id="compare"><h2>${esc(L.compare.title || "한눈에 비교")}</h2>
      <div class="table-wrap"><table>
        <thead><tr>${L.compare.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>${L.compare.rows.map(r => `<tr><th>${esc(r[0])}</th>${r.slice(1).map(c => `<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>
      ${L.pairs ? `<div class="pairs">${L.pairs.map(p => `<div class="pair"><div class="label">${esc(p.label)}</div><div class="flow">${esc(p.from)}<span>→</span>${esc(p.to)}</div></div>`).join("")}</div>` : ""}
    </section>` : ""}

    ${L.eras.map(e => `
    <section id="${e.id}">
      <div class="era-head"><h2>${esc(e.name)}</h2><span class="when">${esc(e.when)}</span></div>
      <p class="lead">${fmt(e.lead)}</p>
      ${e.kings ? `<div class="kings">${e.kings.map(k => `<div class="king ${k.star ? "is-star" : ""}"><div class="kh"><span class="kn">${fmt(k.name)}</span>${k.when ? `<span class="kw">${esc(k.when)}</span>` : ""}${k.ex ? `<span class="ex">${esc(k.ex)}</span>` : ""}</div><ul>${k.items.map(i => `<li>${fmt(i)}</li>`).join("")}</ul></div>`).join("")}</div>` : ""}
      ${e.points || e.photos ? `<div class="era-body ${e.points ? "" : "photos-only"}">
        ${e.points ? `<ul class="points">${e.points.map(p => `<li class="${p.includes("★") ? "is-star" : ""}">${fmt(p)}</li>`).join("")}</ul>` : ""}
        ${e.photos ? `<div class="photos">${e.photos.map(photo).join("")}</div>` : ""}
      </div>` : ""}
    </section>`).join("")}

    <section id="quiz"><h2>퀴즈</h2>
      <div class="quiz">${L.quiz.map(quizCard).join("")}</div>
    </section>

    <footer>사진: Wikimedia Commons (각 사진의 라이선스 표기 참고) · 사진을 누르면 원본 페이지로 이동해요.</footer>
  </div>`;

  document.querySelectorAll(".q").forEach(b => b.onclick = () => b.classList.toggle("open"));
}
</script>
</body>
</html>
